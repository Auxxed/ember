# Optional Hyprland rules for Ember. Include from hyprland.conf if you want
# a compact floating controller:
#
#   source = ~/Work/ember/packaging/hyprland.conf

windowrulev2 = float, class:^(app.ember.Ember)$
windowrulev2 = size 400 740, class:^(app.ember.Ember)$
windowrulev2 = center, class:^(app.ember.Ember)$
