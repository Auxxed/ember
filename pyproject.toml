[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ember"
version = "0.1.0"
description = "Peak Pro companion for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "bleak>=3.0.0",
  "cbor2>=5.6.0",
  "dbus-fast>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ember = "ember.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
